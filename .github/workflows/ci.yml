name: Curriculum validation and build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate curriculum catalog
        run: npm run check:curriculum
      - name: Report curriculum coverage
        run: npm run report:curriculum
      - name: Build production app
        run: npm run build
