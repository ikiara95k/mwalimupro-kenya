name: Curriculum validation and production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/curriculum-coverage-audit"]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate curriculum catalogue
        run: npm run check:curriculum
      - name: Report curriculum coverage
        run: npm run report:curriculum
      - name: Build production app
        run: npm run build
